name: Starea transcrierii în direct

# Spune până unde a ajuns transcrierea în direct (doar cifre, fără conținut: jurnalul e public).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          from monitor_colector.intern_ftp import Intern
          with Intern() as I:
              L = I.json("intern/date/live.json") or {}
              T = I.json("intern/transcrieri/%s.json" % L.get("id")) if L.get("id") else None
          S = (T or {}).get("segmente") or []
          print("live:", {k: L.get(k) for k in ("id", "in_curs", "actualizat", "pana_la")}, "| fragmente:", len(S), "| caractere:", sum(len(s[2]) for s in S))
          PY
