name: Date pentru previzualizare (criptate)

# Pentru lucrul la aspectul site-ului cu date reale: împachetează DOAR datele din zona publică (aceleași fișiere care
# sunt deja publice pe monitor, fără litigii și fără nimic din zona internă), le criptează cu cheia publică primită
# și le pune pe ramura „previzualizare-date”, de unde se șterg după folosire. Fără cheia privată, fișierul nu poate fi citit.
on:
  workflow_dispatch:
    inputs:
      cheie:
        description: "Cheia publică RSA (PEM) cu care se criptează; „sterge” șterge ramura cu datele"
        required: true
      texte:
        description: "Opțional, pentru dezvoltare: baza de date și textele documentelor din aceste surse (ex. hcl,dispozitii), tot criptate"
        default: ""

permissions:
  contents: write

jobs:
  impacheteaza:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Ștergerea ramurii cu date (după folosire)
        if: inputs.cheie == 'sterge'
        run: git push origin --delete previzualizare-date || true
      - uses: actions/setup-python@v6
        if: inputs.cheie != 'sterge'
        with:
          python-version: "3.12"
      - run: pip install requests
        if: inputs.cheie != 'sterge'
      - name: "Datele colectate (doar citire)"
        if: inputs.cheie != 'sterge'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: date-${{ github.run_id }}
          restore-keys: date-
      - name: Arhivă criptată cu datele publice
        if: inputs.cheie != 'sterge'
        env:
          CHEIE: ${{ inputs.cheie }}
          TEXTE: ${{ inputs.texte }}
        run: |
          python - <<'PY'
          import os, sys, tarfile
          sys.path.insert(0, "tools")
          import publica
          with tarfile.open("/tmp/date.tar.gz", "w:gz") as t:
              for nume, cale in publica.public_date().items():
                  t.add(cale, arcname="date/" + nume)
              for d in ("distribuie",):
                  p = os.path.join("data", d, "index.json")
                  if os.path.exists(p):
                      t.add(p, arcname="s/index.json")
              surse = [x for x in os.environ.get("TEXTE", "").split(",") if x]
              if surse:
                  import sqlite3, json
                  sys.path.insert(0, ".")
                  t.add("data/monitor.sqlite", arcname="db/monitor.sqlite")
                  db = sqlite3.connect("data/monitor.sqlite")
                  q = "SELECT d.text_path FROM documents d JOIN posts p ON p.wp_id=d.wp_id WHERE d.text_path IS NOT NULL AND p.source IN (%s)" % ",".join("?" * len(surse))
                  n = 0
                  for (tp,) in db.execute(q, surse):
                      if os.path.exists(tp):
                          t.add(tp, arcname="db/" + tp); n += 1
                  # documentele hotărârilor din arhivă (fără postare)
                  if "hcl" in surse:
                      for (tp,) in db.execute("SELECT text_path FROM documents WHERE wp_id IS NULL AND text_path IS NOT NULL"):
                          if os.path.exists(tp):
                              t.add(tp, arcname="db/" + tp); n += 1
                  print(n, "texte")
                  try:
                      from monitor_colector import collect
                      cat = [dict(c) if isinstance(c, dict) else c for c in collect.discover()]
                      open("/tmp/categorii.json", "w").write(json.dumps(cat, ensure_ascii=False, default=str))
                      t.add("/tmp/categorii.json", arcname="db/categorii.json")
                  except Exception as e:
                      print("categorii:", e)
          print(os.path.getsize("/tmp/date.tar.gz"), "octeți")
          PY
          printf '%s\n' "$CHEIE" | sed 's/\\n/\n/g' > /tmp/pub.pem
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/date.tar.gz -out date.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out cheie.enc
          rm -f /tmp/k.bin /tmp/date.tar.gz
          git config user.name "monitor-local"; git config user.email "monitor-local@users.noreply.github.com"
          git checkout --orphan previzualizare-date
          git rm -rfq --cached . && git add -f date.enc cheie.enc
          git commit -qm "date criptate pentru previzualizare"
          git push -qf origin previzualizare-date
