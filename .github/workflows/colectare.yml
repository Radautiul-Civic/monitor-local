name: Colectare zilnică

on:
  schedule:
    - cron: "15 4 * * *"   # 04:15 UTC = 06:15/07:15 ora României
  workflow_dispatch:
    inputs:
      colectare_completa:
        description: "Colectare completă de la zero (prima rulare)"
        type: boolean
        default: false

concurrency:
  group: colectare
  cancel-in-progress: false

jobs:
  colecteaza:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalare Tesseract (limba română) și poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ron poppler-utils

      - name: Instalare dependențe
        run: pip install -r requirements.txt

      - name: Restaurare date (baza SQLite și documentele)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: date-${{ github.run_id }}
          restore-keys: date-

      - name: Teste
        run: python -m unittest discover -s tests

      - name: Colectare completă (doar la cerere)
        if: ${{ github.event.inputs.colectare_completa == 'true' }}
        run: |
          python -m monitor_colector categorii | tee data_categorii.txt
          python -m monitor_colector colecteaza --tot
          python -m monitor_colector arhiva

      - name: Colectare zilnică (postări noi sau modificate)
        run: python -m monitor_colector colecteaza
        env:
          MC_DELAY: "1.0"

      - name: Descărcare documente (în tranșe, ca prima rulare să nu fie interminabilă)
        run: python -m monitor_colector descarca --max 1000
        env:
          MC_DELAY: "1.0"

      - name: OCR pe PDF-urile scanate (buget de timp, procesele-verbale primele)
        # Se oprește singur după 150 de minute; ce s-a terminat rămâne salvat.
        # Dacă pică, rularea merge mai departe la indicatori, salvare și publicare.
        run: python -m monitor_colector ocr --minute 150
        continue-on-error: true
        timeout-minutes: 170
        env:
          MC_OCR_LANG: ron

      - name: Registre de urbanism (tabele din PDF)
        if: always()
        run: python -m monitor_colector urbanism
        continue-on-error: true

      - name: Achiziții din SICAP (zilnic ultimele 90 de zile; complet din 2018 la cerere)
        if: always()
        run: |
          if [ "${{ github.event.inputs.colectare_completa }}" = "true" ]; then
            python -m monitor_colector sicap --tot
          else
            python -m monitor_colector sicap
          fi
        continue-on-error: true
        timeout-minutes: 150

      - name: Documente Word din textele extrase (pentru verificare)
        if: always()
        run: python -m monitor_colector word
        continue-on-error: true

      - name: Indicatori și liste
        if: always()
        run: python -m monitor_colector indicatori

      - name: Publicare pe hosting (FTPS)
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python tools/publica.py

      - name: Salvare date pentru rularea următoare
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: date-${{ github.run_id }}

      - name: Rapoarte ca artefact (pentru verificare)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapoarte
          path: |
            data/indicatori.json
            data/indicatori.md
            data/urbanism-registre.txt
            data_categorii.txt
            data/raw/**
            data/liste.json
            data/sicap.json
            data/sicap-de-verificat.txt
          if-no-files-found: ignore
          retention-days: 14
