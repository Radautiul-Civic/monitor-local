name: Publicare (doar site-ul)

# Urcă pagina și datele deja colectate, fără colectare (pentru modificări de aspect), apoi golește cache-ul Cloudflare.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "site_intern/**"]

concurrency:
  group: colectare
  cancel-in-progress: false

jobs:
  publica:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: "Datele colectate (doar citire)"
        uses: actions/cache/restore@v4
        with:
          path: data
          key: date-${{ github.run_id }}
          restore-keys: date-
      - name: Publicare pe hosting (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python tools/publica.py
      - name: Golire cache Cloudflare
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then echo "lipsesc secretele Cloudflare"; exit 0; fi
          purge() { curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data "$1"; }
          r=$(purge '{"hosts":["monitor.radautiulcivic.ro"]}')
          echo "$r" | grep -q '"success": *true' && { echo "cache golit (monitor)"; exit 0; }
          r=$(purge '{"purge_everything":true}')
          echo "$r" | grep -q '"success": *true' && echo "cache golit (toată zona)" || { echo "eroare: $r"; exit 1; }
