name: Test detectare înregistrări

# Verifică dacă înregistrările ședințelor se pot găsi automat din articolele radautiziar.ro (videoclip YouTube încorporat).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: pip install -q yt-dlp requests
      - uses: denoland/setup-deno@v2
      - run: |
          for v in rf4ADf-FjGM chq4NwFuBN8; do
            echo "== $v"; yt-dlp --skip-download --print "%(id)s | %(title)s | %(duration)s | %(upload_date)s | %(channel)s | %(live_status)s" "https://www.youtube.com/watch?v=$v" 2>&1 | tail -3 || true
            timeout 300 yt-dlp -f "bestaudio/best" --download-sections "*0-120" -o "$v.%(ext)s" "https://www.youtube.com/watch?v=$v" 2>&1 | tail -3 || true; ls -la $v.* 2>/dev/null || echo "fără fișier audio"
          done
