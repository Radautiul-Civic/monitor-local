name: Pilot alt municipiu (colectare de probă, fără publicare)

# Rulează colectorul monitorului pe site-ul altei primării cu aceeași structură WordPress, în folderul de date al
# orașului. Nu publică nimic: verifică doar cât din colector merge așa cum e.
on:
  workflow_dispatch:
    inputs:
      oras:
        description: "slug oraș (ex. falticeni)"
        default: "falticeni"
      url:
        description: "adresa site-ului primăriei"
        default: "https://www.falticeni.ro"
      max:
        description: "documente de descărcat la rularea asta"
        default: "300"

permissions:
  contents: read

concurrency:
  group: pilot-${{ inputs.oras }}
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MC_BASE_URL: ${{ inputs.url }}
      MC_DATA_DIR: data-${{ inputs.oras }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          pip install -r requirements.txt
      - name: Datele orașului (din rularea anterioară)
        uses: actions/cache/restore@v4
        with:
          path: data-${{ inputs.oras }}
          key: oras-${{ inputs.oras }}-${{ github.run_id }}
          restore-keys: oras-${{ inputs.oras }}-
      - run: mkdir -p "$MC_DATA_DIR" && python -m monitor_colector categorii | head -60
      - name: Hotărâri, proiecte, procese-verbale, dispoziții
        run: python -m monitor_colector colecteaza --surse hcl,proiecte,pv,dispozitii,cu,ac,buget,contracte,angajari
      - name: Documente
        continue-on-error: true
        run: python -m monitor_colector descarca --max ${{ inputs.max }}
      - name: Indicatori
        continue-on-error: true
        run: python -m monitor_colector indicatori
      - name: Ce s-a strâns
        run: |
          python - <<'PY'
          import os, sqlite3, json
          d = os.environ["MC_DATA_DIR"]
          c = sqlite3.connect(os.path.join(d, "monitor.sqlite"))
          tab = [r[0] for r in c.execute("select name from sqlite_master where type='table'")]
          print("tabele:", tab)
          for t in tab:
              print(f"  {t}: {c.execute(f'select count(*) from {t}').fetchone()[0]}")
          print(c.execute("select source, count(*), min(date), max(date) from posts group by source").fetchall())
          if "hcl" in tab:
              print("hcl pe ani:", c.execute("select year, count(*), max(number) from hcl group by year order by year").fetchall())
              print("exemple:", c.execute("select year, number, adoption_date, substr(title,1,90) from hcl order by year desc, number desc limit 5").fetchall())
          if "documents" in tab:
              print("documente:", c.execute("select count(*), sum(text_path is not null), sum(pages) from documents").fetchone())
          for src in ("hcl", "proiecte", "pv", "dispozitii"):
              print("== exemple", src)
              for w, t, l, dt in c.execute("select wp_id, title, link, date from posts where source=? order by date desc limit 6", (src,)).fetchall():
                  print("  ", dt, "|", t[:140], "|", l)
                  for dtxt, du in c.execute("select link_text, url from documents where wp_id=? limit 3", (w,)).fetchall():
                      print("       doc:", (dtxt or "")[:90], "|", du)
          for f in sorted(os.listdir(d)):
              print("  fișier", f, os.path.getsize(os.path.join(d, f)))
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data-${{ inputs.oras }}
          key: oras-${{ inputs.oras }}-${{ github.run_id }}
