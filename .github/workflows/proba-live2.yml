name: Probă descărcare completă a transmisiunii în curs (temporar)
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp
      - env:
          URL: ${{ inputs.url }}
        run: |
          yt-dlp --skip-download --print "durata_anuntata=%(duration)s" "$URL"
          yt-dlp -F "$URL" | tail -8
          s=$(date +%s)
          timeout 1200 yt-dlp -f "bestaudio/best" -o "tot.%(ext)s" "$URL" 2>&1 | grep -v "\[download\] *[0-9.]*% of" | tail -6
          echo "secunde_descarcare=$(( $(date +%s) - s ))"
          ls -la tot.* && ffprobe -hide_banner -loglevel error -show_entries format=duration -of csv=p=0 tot.*
