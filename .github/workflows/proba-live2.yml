name: Probă transcriere în direct, o singură bucată (temporar)
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp faster-whisper numpy
      - env:
          URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os, time, subprocess
          from monitor_colector import live
          from monitor_colector.video import audio
          t = time.time(); d = live.durata(os.environ["URL"]); print("durata:", d and d[0], round(time.time() - t), "s", flush=True)
          for a, b in ((0, 120), (max(0, int(d[0]) - 200), int(d[0]) - 80)):
              t = time.time(); f = live.bucata(os.environ["URL"], a, b); print("bucata", a, b, "->", f, f and os.path.getsize(f), round(time.time() - t), "s", flush=True)
              if not f:
                  r = subprocess.run(["yt-dlp", "-f", "bestaudio/best", "--download-sections", f"*{a}-{b}", "-o", "x.%(ext)s", os.environ["URL"]], capture_output=True, text=True, timeout=600)
                  print((r.stdout + r.stderr)[-1500:], flush=True)
          from faster_whisper import WhisperModel
          t = time.time(); m = WhisperModel("large-v3-turbo", device="cpu", compute_type="int8", cpu_threads=os.cpu_count() or 4); print("model", round(time.time() - t), "s", flush=True)
          if f:
              t = time.time(); x = audio(f); segs, _ = m.transcribe(x, language="ro", beam_size=3, vad_filter=True, condition_on_previous_text=False); n = sum(len(s.text) for s in segs)
              print("transcris", round(len(x) / 16000), "s de sunet în", round(time.time() - t), "s;", n, "caractere", flush=True)
          PY
