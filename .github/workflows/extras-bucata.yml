name: Transcrierea unei bucăți dintr-o înregistrare (extras criptat)

# Ia o bucată de la începutul unei înregistrări (merge și la o transmisiune în curs), o transcrie și scoate textul CRIPTAT
# (cheia publică: tools/extras-cheie-publica.pem). În jurnalul public apar doar cifre.
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      de_la:
        default: "0"
      pana_la:
        default: "1500"
      model:
        default: "large-v3-turbo"

permissions:
  contents: read

jobs:
  b:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp faster-whisper numpy
      - env:
          URL: ${{ inputs.url }}
          A: ${{ inputs.de_la }}
          B: ${{ inputs.pana_la }}
          MODEL: ${{ inputs.model }}
        run: |
          s=$(date +%s)
          timeout 5400 yt-dlp -q -f "bestaudio/best" --download-sections "*$A-$B" -o "b.%(ext)s" "$URL" || echo "descărcarea s-a oprit"
          ls -la b.* && echo "descărcare: $(( $(date +%s) - s )) s"
          python - <<'PY'
          import os, json, glob, time
          from faster_whisper import WhisperModel
          from monitor_colector.video import audio
          f = glob.glob("b.*")[0]; x = audio(f); print("sunet:", round(len(x) / 16000), "s", flush=True)
          t = time.time(); m = WhisperModel(os.environ["MODEL"], device="cpu", compute_type="int8", cpu_threads=os.cpu_count() or 4)
          segs, _ = m.transcribe(x, language="ro", beam_size=5, vad_filter=True, condition_on_previous_text=False,
                                 initial_prompt="Ședința Consiliului Local al Municipiului Rădăuți. Proiect de hotărâre, consilier local, primar, viceprimar, vot, ordinea de zi.")
          a = float(os.environ["A"]); S = [[round(s.start + a, 1), round(s.end + a, 1), s.text.strip()] for s in segs]
          print("fragmente:", len(S), "| transcriere:", round(time.time() - t), "s", flush=True)
          json.dump(S, open("extras.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          gzip -9 extras.json && openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -in extras.json.gz -out extras.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey tools/extras-cheie-publica.pem -in k.txt -out k.enc
          rm -f extras.json.gz k.txt
          echo "=====CHEIE"; base64 -w 160 k.enc; echo "=====EXTRAS"; base64 -w 160 extras.enc; echo "=====SFARSIT"
