name: Recuperare (OCR în paralel)

# Pornire manuală. Descarcă tot ce lipsește, împarte documentele scanate în loturi
# și face OCR pe până la 20 de mașini simultan; la final importă textele,
# generează documentele Word, recalculează indicatorii și publică.

on:
  workflow_dispatch:
    inputs:
      colectare_completa:
        description: "Recolectează tot de pe site și din arhivă înainte"
        type: boolean
        default: false

concurrency:
  group: colectare
  cancel-in-progress: false

jobs:
  pregatire:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      loturi: ${{ steps.coada.outputs.loturi }}
      din: ${{ steps.coada.outputs.din }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurare date
        uses: actions/cache/restore@v4
        with:
          path: data
          key: date-${{ github.run_id }}
          restore-keys: date-
      - name: Teste
        run: python -m unittest discover -s tests
      - name: Colectare completă (la cerere)
        if: ${{ github.event.inputs.colectare_completa == 'true' }}
        run: |
          python -m monitor_colector colecteaza --tot
          python -m monitor_colector arhiva
      - name: Colectare (postări noi)
        run: python -m monitor_colector colecteaza
      - name: Descărcare documente (toate cele lipsă, câte unul pe secundă)
        run: python -m monitor_colector descarca
        env:
          MC_DELAY: "1.0"
      - name: Coada OCR și împărțirea pe loturi
        id: coada
        run: python -m monitor_colector coada
      - name: Salvare date pentru loturi
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: date-${{ github.run_id }}-pregatire

  ocr:
    needs: pregatire
    if: ${{ needs.pregatire.outputs.din != '0' && needs.pregatire.outputs.din != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        lot: ${{ fromJSON(needs.pregatire.outputs.loturi) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalare Tesseract (limba română) și poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ron poppler-utils
      - run: pip install -r requirements.txt
      - name: Date din pregătire
        uses: actions/cache/restore@v4
        with:
          path: data
          key: date-${{ github.run_id }}-pregatire
          fail-on-cache-miss: true
      - name: OCR pe lotul ${{ matrix.lot }}
        run: python -m monitor_colector ocr-lot --lot ${{ matrix.lot }} --din ${{ needs.pregatire.outputs.din }} --iesire lot --minute 300
        continue-on-error: true
        env:
          MC_OCR_LANG: ron
      - name: Criptare rezultate (repo-ul e public; textele pot conține date personale)
        if: always()
        env:
          CHEIE: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p lot
          tar czf - lot | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CHEIE -out lot-${{ matrix.lot }}.enc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-lot-${{ matrix.lot }}
          path: lot-${{ matrix.lot }}.enc
          retention-days: 1

  final:
    needs: [pregatire, ocr]
    if: ${{ always() && needs.pregatire.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Date din pregătire
        uses: actions/cache/restore@v4
        with:
          path: data
          key: date-${{ github.run_id }}-pregatire
          fail-on-cache-miss: true
      - name: Rezultatele loturilor
        uses: actions/download-artifact@v4
        with:
          pattern: ocr-lot-*
          path: loturi
      - name: Decriptare și import
        env:
          CHEIE: ${{ secrets.FTP_PASSWORD }}
        run: |
          dirs=""
          for f in $(find loturi -name '*.enc' 2>/dev/null); do
            d="dec/$(basename "$f" .enc)"; mkdir -p "$d"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CHEIE -in "$f" | tar xzf - -C "$d" && dirs="$dirs $d/lot"
          done
          python -m monitor_colector importa --foldere $dirs
      - name: Registre de urbanism (tabele din PDF)
        run: python -m monitor_colector urbanism
        continue-on-error: true
      - name: Documente Word
        run: python -m monitor_colector word
        continue-on-error: true
      - name: Indicatori și liste
        run: python -m monitor_colector indicatori
      - name: Publicare pe hosting (FTPS)
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python tools/publica.py
      - name: Salvare date pentru rulările următoare
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: date-${{ github.run_id }}
      - name: Raport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapoarte
          path: |
            data/urbanism.json
            data/indicatori.md
            data/indicatori.json
            data/raw/**
          if-no-files-found: ignore
          retention-days: 14
