name: Probă video Facebook (temporar)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Pagina sau videoclipul de încercat"
        default: "https://www.facebook.com/watch/61559725245078/"

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalare yt-dlp și ffmpeg
        run: |
          pip install -U yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          yt-dlp --version
      - name: Lista videoclipurilor (mai multe forme de adresă)
        continue-on-error: true
        run: |
          for u in "${{ inputs.url }}" "https://www.facebook.com/61559725245078/videos" "https://www.facebook.com/profile.php?id=61559725245078&sk=videos"; do
            echo "=== $u"
            yt-dlp --flat-playlist --playlist-end 15 --print "%(id)s | %(upload_date)s | %(duration)s | %(title).120s | %(url)s" "$u" 2>&1 | tail -25 || true
          done
      - name: Descărcare probă (doar audio, tot fișierul)
        continue-on-error: true
        run: |
          time yt-dlp -f "bestaudio/best" -x --audio-format mp3 --audio-quality 9 -o "proba.%(ext)s" "${{ inputs.url }}" 2>&1 | grep -v "\[download\] *[0-9.]*% of" | tail -15
          ls -la proba* 2>/dev/null || echo "nimic descărcat"
          ffprobe -hide_banner proba.mp3 2>&1 | grep -E "Duration|Stream" || true
